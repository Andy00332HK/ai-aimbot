# BoT-SORT 設定（基於 ultralytics 預設，加大 track_buffer）
# 與 bytetrack.yaml 相同的閾值，另開啟 GMC 相機運動補償：
#   gmc_method: sparseOptFlow → 幀間稀疏光流估計「玩家轉身/平移造成的全域畫面運動」，
#   反向補償每條軌跡的 Kalman 狀態（位置+速度），
#   → 鎖定目標在畫面上被「釘住」，不隨視角移動而滑動脫鎖。
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: true
# BoT-SORT 專屬
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: false
model: auto
